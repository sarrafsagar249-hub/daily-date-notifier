name: Daily Date Notifier

on:
  workflow_dispatch:

jobs:
  test-date:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Libraries
        run: |
          pip install -r requirements.txt

      - name: Run Script
        run: |
          python main.py
